name: Build Camera iOS IPA

on:
  push:
    branches: [main]
    paths: ['camera-ios/**', '.github/workflows/build-camera-ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: camera-ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: camera-ios
        run: |
          set -o pipefail
          xcodebuild -project QingyaoCamera.xcodeproj -scheme QingyaoCamera \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA (unsigned)
        working-directory: camera-ios
        run: |
          ls build/Build/Products/Release-iphoneos/
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/QingyaoCamera.app Payload/
          zip -qry QingyaoCamera-unsigned.ipa Payload
          ls -la QingyaoCamera-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QingyaoCamera-IPA
          path: camera-ios/QingyaoCamera-unsigned.ipa
          if-no-files-found: error
      - name: Upload to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd camera-ios
          cp QingyaoCamera-unsigned.ipa QingyaoCamera-v4.9.2-unsigned.ipa
          gh release create v4.9.2 QingyaoCamera-v4.9.2-unsigned.ipa --title "QingyaoCamera v4.9.2" --notes "倾瑶相机 v4.9.2：修复 SE3 小屏按钮溢出 / 修复开屏自动拍照（音量键误触发）" || gh release upload v4.9.2 QingyaoCamera-v4.9.2-unsigned.ipa --clobber
